name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Shellcheck
        run: shellcheck lib/cache-common.sh lib/cache-restore.sh lib/cache-save.sh lib/cache-gc.sh

  # actionlint catches the inline `run:` shell blocks in this very workflow
  # that the standalone `shellcheck` job above does not see. Without this,
  # SC2012 / SC2015 / SC2086 issues in test fixtures slip past CI and only
  # surface when something else (a developer's local actionlint, a code
  # reviewer) happens to look. The download script is pinned to a specific
  # actionlint release commit to avoid supply-chain risk from tracking main.
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  integration-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # cache-gc.sh re-invokes itself through local-mutex's CLI to take the same
      # per-key/per-target locks the actions hold, so the direct-script gc tests
      # below need it. Point at a checkout of the exact version the actions pin —
      # the real primitive, not a stub. Steps that go through an action get their
      # own copy from that action's `uses:` and ignore this.
      LOCAL_MUTEX_CLI: ${{ github.workspace }}/.local-mutex/lib/local-mutex.sh
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Check out local-mutex (pinned) for the direct-script gc lock tests
        uses: actions/checkout@v7.0.0
        with:
          repository: curlewlabs-com/local-mutex
          ref: v2.1.0
          path: .local-mutex

      - name: Restore against non-existent cache dir (cold start)
        id: restore-cold
        uses: ./
        with:
          path: /tmp/test-cold-restore
          key: any-key
          cache-dir: /tmp/nonexistent-cache-dir

      - name: Verify cold start exits cleanly with miss
        run: |
          [ "${{ steps.restore-cold.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false on cold start, got: ${{ steps.restore-cold.outputs.cache-hit }}" && exit 1)
          [ ! -d /tmp/test-cold-restore ] \
            || (echo "Expected path to not exist on cold-start miss" && exit 1)
          echo "Cold start restore: OK"

      - name: Create test fixture
        run: |
          mkdir -p /tmp/test-source
          echo "hello" > /tmp/test-source/a.txt
          echo "world" > /tmp/test-source/b.txt
          mkdir -p /tmp/test-source/sub
          echo "nested" > /tmp/test-source/sub/c.txt

      - name: Save to local cache
        uses: ./save
        with:
          path: /tmp/test-source
          key: test-exact-key
          cache-dir: /tmp/local-cache

      - name: Verify entry was created
        run: |
          . lib/cache-common.sh
          encoded_key=$(encode_key 'test-exact-key')
          test -d "/tmp/local-cache/entries/${encoded_key}" || (echo "Entry not found" && exit 1)
          echo "Entry exists: OK"

      - name: Delete source to prove restore works
        run: rm -rf /tmp/test-source

      - name: Restore from local cache (exact)
        id: restore-exact
        uses: ./
        with:
          path: /tmp/test-restore
          key: test-exact-key
          cache-dir: /tmp/local-cache

      - name: Verify exact restore
        run: |
          [ "${{ steps.restore-exact.outputs.cache-hit }}" = "true" ] \
            || (echo "Expected cache-hit=true, got: ${{ steps.restore-exact.outputs.cache-hit }}" && exit 1)
          [ "${{ steps.restore-exact.outputs.cache-matched-key }}" = "test-exact-key" ] \
            || (echo "Expected cache-matched-key=test-exact-key, got: ${{ steps.restore-exact.outputs.cache-matched-key }}" && exit 1)
          . lib/cache-common.sh
          encoded_key=$(encode_key 'test-exact-key')
          diff -x .local-cache-restore -x .local-cache-key "/tmp/local-cache/entries/${encoded_key}" /tmp/test-restore \
            || (echo "Restored content does not match" && exit 1)
          echo "Exact restore: OK"

      - name: Restore with prefix key (miss on exact, hit on prefix)
        id: restore-prefix
        uses: ./
        with:
          path: /tmp/test-restore-prefix
          key: test-exact-key-v2
          restore-keys: |
            test-exact-key
          cache-dir: /tmp/local-cache

      - name: Verify prefix restore
        run: |
          [ "${{ steps.restore-prefix.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false for prefix match, got: ${{ steps.restore-prefix.outputs.cache-hit }}" && exit 1)
          [ "${{ steps.restore-prefix.outputs.cache-matched-key }}" = "test-exact-key" ] \
            || (echo "Expected raw cache-matched-key=test-exact-key for prefix match, got: ${{ steps.restore-prefix.outputs.cache-matched-key }}" && exit 1)
          . lib/cache-common.sh
          encoded_key=$(encode_key 'test-exact-key')
          diff -x .local-cache-restore -x .local-cache-key "/tmp/local-cache/entries/${encoded_key}" /tmp/test-restore-prefix \
            || (echo "Prefix-restored content does not match" && exit 1)
          echo "Prefix restore: OK"

      - name: Restore with no match
        id: restore-miss
        uses: ./
        with:
          path: /tmp/test-restore-miss
          key: no-such-key
          cache-dir: /tmp/local-cache

      - name: Verify cache miss
        run: |
          [ "${{ steps.restore-miss.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false for miss, got: ${{ steps.restore-miss.outputs.cache-hit }}" && exit 1)
          [ -z "${{ steps.restore-miss.outputs.cache-matched-key }}" ] \
            || (echo "Expected empty cache-matched-key on miss, got: ${{ steps.restore-miss.outputs.cache-matched-key }}" && exit 1)
          [ ! -d /tmp/test-restore-miss ] \
            || (echo "Expected path to not exist on miss" && exit 1)
          echo "Cache miss: OK"

      - name: Second save with same key is a no-op
        uses: ./save
        with:
          path: /tmp/test-restore
          key: test-exact-key
          cache-dir: /tmp/local-cache

      - name: Verify idempotent save
        run: |
          count=0
          for path in /tmp/local-cache/entries/*; do
            [ -e "$path" ] || continue
            count=$((count + 1))
          done
          [ "$count" = "1" ] \
            || (echo "Expected 1 cache entry, found: $count" && exit 1)
          echo "Idempotent save: OK"

      - name: Save with non-existent source path exits cleanly
        uses: ./save
        with:
          path: /tmp/this-path-does-not-exist
          key: nonexistent-source-key
          cache-dir: /tmp/local-cache

      - name: Verify non-existent source was not cached
        run: |
          . lib/cache-common.sh
          encoded_key=$(encode_key 'nonexistent-source-key')
          [ ! -d "/tmp/local-cache/entries/${encoded_key}" ] \
            || (echo "Expected no entry for non-existent source" && exit 1)
          echo "Non-existent source guard: OK"

      - name: Set up multi-prefix fixture
        run: |
          mkdir -p /tmp/test-multi-prefix
          echo "multi" > /tmp/test-multi-prefix/d.txt

      - name: Save multi-prefix fixture under second prefix
        uses: ./save
        with:
          path: /tmp/test-multi-prefix
          key: prefix-b-v1
          cache-dir: /tmp/local-cache

      - name: Restore with multiple restore-keys (first misses, second hits)
        id: restore-multi-prefix
        uses: ./
        with:
          path: /tmp/test-restore-multi-prefix
          key: no-match-at-all
          restore-keys: |
            prefix-a-
            prefix-b-
          cache-dir: /tmp/local-cache

      - name: Verify second prefix was used
        run: |
          [ "${{ steps.restore-multi-prefix.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false for prefix match" && exit 1)
          [ "${{ steps.restore-multi-prefix.outputs.cache-matched-key }}" = "prefix-b-v1" ] \
            || (echo "Expected raw matched key prefix-b-v1, got: ${{ steps.restore-multi-prefix.outputs.cache-matched-key }}" && exit 1)
          . lib/cache-common.sh
          encoded_key=$(encode_key 'prefix-b-v1')
          diff -x .local-cache-restore -x .local-cache-key "/tmp/local-cache/entries/${encoded_key}" /tmp/test-restore-multi-prefix \
            || (echo "Multi-prefix restored content does not match" && exit 1)
          echo "Multi-prefix restore: OK"

      - name: Set up first-prefix-wins fixture
        run: |
          mkdir -p /tmp/test-prefix-a
          echo "from-prefix-a" > /tmp/test-prefix-a/e.txt

      - name: Save first-prefix-wins fixture under prefix-a
        uses: ./save
        with:
          path: /tmp/test-prefix-a
          key: prefix-a-v1
          cache-dir: /tmp/local-cache

      - name: Restore with multiple restore-keys (both match, first wins)
        id: restore-prefix-order
        uses: ./
        with:
          path: /tmp/test-restore-prefix-order
          key: no-match-at-all-2
          restore-keys: |
            prefix-a-
            prefix-b-
          cache-dir: /tmp/local-cache

      - name: Verify first prefix wins when both match
        run: |
          [ "${{ steps.restore-prefix-order.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false for prefix match" && exit 1)
          # prefix-a- is listed first and has an entry; it must win over prefix-b-
          [ "${{ steps.restore-prefix-order.outputs.cache-matched-key }}" = "prefix-a-v1" ] \
            || (echo "Expected raw matched key prefix-a-v1, got: ${{ steps.restore-prefix-order.outputs.cache-matched-key }}" && exit 1)
          . lib/cache-common.sh
          encoded_key=$(encode_key 'prefix-a-v1')
          diff -x .local-cache-restore -x .local-cache-key "/tmp/local-cache/entries/${encoded_key}" /tmp/test-restore-prefix-order \
            || (echo "Expected prefix-a-v1 to win but content does not match" && exit 1)
          echo "First-prefix-wins: OK"

      - name: Set up key-sanitization fixture
        run: |
          mkdir -p /tmp/test-special-key
          echo "special" > /tmp/test-special-key/f.txt

      - name: Save with key containing special characters
        uses: ./save
        with:
          path: /tmp/test-special-key
          key: "my/special:key@v1"
          cache-dir: /tmp/local-cache

      - name: Verify encoded entry name on disk
        run: |
          . lib/cache-common.sh
          encoded_key=$(encode_key 'my/special:key@v1')
          [ -d "/tmp/local-cache/entries/${encoded_key}" ] \
            || (echo "Expected encoded entry ${encoded_key} not found" && exit 1)
          echo "Key encoding: OK"

      - name: Restore with special-character key (exact hit)
        id: restore-sanitized
        uses: ./
        with:
          path: /tmp/test-restore-sanitized
          key: "my/special:key@v1"
          cache-dir: /tmp/local-cache

      - name: Verify special-character key restores correctly
        run: |
          [ "${{ steps.restore-sanitized.outputs.cache-hit }}" = "true" ] \
            || (echo "Expected cache-hit=true for special-character key, got: ${{ steps.restore-sanitized.outputs.cache-hit }}" && exit 1)
          [ "${{ steps.restore-sanitized.outputs.cache-matched-key }}" = "my/special:key@v1" ] \
            || { echo "Expected raw key on exact hit, got: ${{ steps.restore-sanitized.outputs.cache-matched-key }}"; exit 1; }
          . lib/cache-common.sh
          encoded_key=$(encode_key 'my/special:key@v1')
          diff -x .local-cache-restore -x .local-cache-key "/tmp/local-cache/entries/${encoded_key}" /tmp/test-restore-sanitized \
            || (echo "Special-character key restore content mismatch" && exit 1)
          echo "Special-character key restore: OK"

      - name: Set up dotted-key fixture
        run: |
          mkdir -p /tmp/test-dotted-key-src /tmp/test-dotdot-key-src
          echo "dot" > /tmp/test-dotted-key-src/data.txt
          echo "dotdot" > /tmp/test-dotdot-key-src/data.txt

      - name: Dot key round-trips safely
        uses: ./save
        with:
          path: /tmp/test-dotted-key-src
          key: "."
          cache-dir: /tmp/local-cache
      - name: Verify dot key round-trip
        run: |
          . lib/cache-common.sh
          encoded_key=$(encode_key '.')
          [ -d "/tmp/local-cache/entries/${encoded_key}" ] \
            || (echo "Expected encoded dot-key entry ${encoded_key}" && exit 1)
          sh lib/cache-restore.sh /tmp/test-dotted-key-dst "." /tmp/local-cache ""
          [ "$(cat /tmp/test-dotted-key-dst/data.txt)" = "dot" ] \
            || (echo "Expected dot-key restore content" && exit 1)
          echo "Dot key support: OK"

      - name: Double-dot key round-trips safely
        uses: ./save
        with:
          path: /tmp/test-dotdot-key-src
          key: ".."
          cache-dir: /tmp/local-cache
      - name: Verify double-dot key round-trip
        run: |
          . lib/cache-common.sh
          encoded_key=$(encode_key '..')
          [ -d "/tmp/local-cache/entries/${encoded_key}" ] \
            || (echo "Expected encoded double-dot key entry ${encoded_key}" && exit 1)
          sh lib/cache-restore.sh /tmp/test-dotdot-key-dst ".." /tmp/local-cache ""
          [ "$(cat /tmp/test-dotdot-key-dst/data.txt)" = "dotdot" ] \
            || (echo "Expected double-dot key restore content" && exit 1)
          echo "Double-dot key support: OK"

      - name: Distinct raw keys with same old sanitized form stay distinct
        run: |
          mkdir -p /tmp/test-collision-a /tmp/test-collision-b
          echo "slash" > /tmp/test-collision-a/data.txt
          echo "colon" > /tmp/test-collision-b/data.txt

          sh lib/cache-save.sh /tmp/test-collision-a "a/b" /tmp/local-cache
          sh lib/cache-save.sh /tmp/test-collision-b "a:b" /tmp/local-cache

          . lib/cache-common.sh
          encoded_a=$(encode_key 'a/b')
          encoded_b=$(encode_key 'a:b')
          [ -d "/tmp/local-cache/entries/${encoded_a}" ] \
            || (echo "Missing encoded entry for a/b" && exit 1)
          [ -d "/tmp/local-cache/entries/${encoded_b}" ] \
            || (echo "Missing encoded entry for a:b" && exit 1)

          sh lib/cache-restore.sh /tmp/test-collision-out-a "a/b" /tmp/local-cache ""
          sh lib/cache-restore.sh /tmp/test-collision-out-b "a:b" /tmp/local-cache ""
          [ "$(cat /tmp/test-collision-out-a/data.txt)" = "slash" ] \
            || (echo "a/b restored wrong content" && exit 1)
          [ "$(cat /tmp/test-collision-out-b/data.txt)" = "colon" ] \
            || (echo "a:b restored wrong content" && exit 1)
          echo "Key collision regression: OK"

      - name: Dash-prefix restore-key is handled safely
        id: restore-dash-prefix
        uses: ./
        with:
          path: /tmp/test-dash-prefix
          key: no-match-dash
          restore-keys: |
            -rf
          cache-dir: /tmp/local-cache

      - name: Verify dash restore-key produced a clean miss
        run: |
          [ "${{ steps.restore-dash-prefix.outputs.cache-hit }}" = "false" ] \
            || (echo "Expected cache-hit=false for dash prefix, got: ${{ steps.restore-dash-prefix.outputs.cache-hit }}" && exit 1)
          [ -z "${{ steps.restore-dash-prefix.outputs.cache-matched-key }}" ] \
            || (echo "Expected empty cache-matched-key for dash prefix miss" && exit 1)
          [ ! -d /tmp/test-dash-prefix ] \
            || (echo "Expected path to not exist on dash prefix miss" && exit 1)
          echo "Dash prefix safety: OK"

      # Restore-target safety guard. cache-restore.sh does an
      # unconditional `rm -rf "$path_to_cache"` on a stale-marker
      # re-sync, so a misconfigured workflow passing path: /, path: $HOME,
      # or a relative path could wipe the runner. The guard rejects
      # those targets up-front with exit 2 before any filesystem side
      # effect. One test per rejection class plus a positive control
      # confirming a safe sibling path is still accepted.
      - name: Restore-target guard rejects root
        run: |
          set +e
          out=$(sh lib/cache-restore.sh / any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for root path, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'system root' \
            || (echo "Expected 'system root' in error, got: $out" && exit 1)
          echo "Reject /: OK"

      - name: Restore-target guard rejects /.
        run: |
          set +e
          out=$(sh lib/cache-restore.sh /. any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for /., got $rc. Output: $out" && exit 1)
          echo "Reject /.: OK"

      - name: Restore-target guard rejects /..
        run: |
          set +e
          out=$(sh lib/cache-restore.sh /.. any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for /.., got $rc. Output: $out" && exit 1)
          echo "Reject /..: OK"

      - name: Restore-target guard rejects relative paths
        run: |
          set +e
          out=$(sh lib/cache-restore.sh some/relative any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for relative path, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'must be absolute' \
            || (echo "Expected 'must be absolute' in error, got: $out" && exit 1)
          echo "Reject relative: OK"

      - name: Restore-target guard rejects whitespace-only paths
        run: |
          set +e
          out=$(sh lib/cache-restore.sh "   " any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          # cache-restore.sh's empty check runs first for unambiguously
          # empty strings; tabs/spaces get past it and hit the new
          # whitespace-only guard. Both produce exit 2, which is the
          # invariant we're asserting.
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for whitespace-only path, got $rc. Output: $out" && exit 1)
          echo "Reject whitespace-only: OK"

      - name: Restore-target guard rejects $HOME
        run: |
          set +e
          out=$(HOME=/tmp/guard-home sh lib/cache-restore.sh /tmp/guard-home any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for HOME path, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'HOME' \
            || (echo "Expected HOME in error, got: $out" && exit 1)
          echo "Reject \$HOME: OK"

      - name: Restore-target guard rejects parents of $HOME
        run: |
          set +e
          out=$(HOME=/tmp/guard-parent/home sh lib/cache-restore.sh /tmp/guard-parent any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for parent of HOME, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'HOME' \
            || (echo "Expected HOME in error, got: $out" && exit 1)
          echo "Reject parent of \$HOME: OK"

      - name: Restore-target guard rejects $GITHUB_WORKSPACE
        run: |
          set +e
          # Unset HOME so the HOME check doesn't fire first and mask the
          # GITHUB_WORKSPACE-specific diagnostic we're asserting on. Also
          # strip the runner's own GITHUB_WORKSPACE and RUNNER_WORKSPACE
          # from the outer env so we exercise exactly the value we pass.
          out=$(env -u HOME -u RUNNER_WORKSPACE GITHUB_WORKSPACE=/tmp/guard-ws sh lib/cache-restore.sh /tmp/guard-ws any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for GITHUB_WORKSPACE path, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'GITHUB_WORKSPACE' \
            || (echo "Expected GITHUB_WORKSPACE in error, got: $out" && exit 1)
          echo "Reject \$GITHUB_WORKSPACE: OK"

      - name: Restore-target guard rejects parents of $RUNNER_WORKSPACE
        run: |
          set +e
          out=$(env -u HOME -u GITHUB_WORKSPACE RUNNER_WORKSPACE=/tmp/guard-rw/inner sh lib/cache-restore.sh /tmp/guard-rw any-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "2" ] \
            || (echo "Expected exit 2 for parent of RUNNER_WORKSPACE, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'RUNNER_WORKSPACE' \
            || (echo "Expected RUNNER_WORKSPACE in error, got: $out" && exit 1)
          echo "Reject parent of \$RUNNER_WORKSPACE: OK"

      - name: Restore-target guard accepts a safe sibling path
        run: |
          # Positive control: a path under /tmp that is not the root, not
          # an ancestor of any guarded variable, and has no cache entry
          # should produce a clean cache miss (exit 0) rather than a
          # rejection. This confirms the guard is not over-rejecting.
          set +e
          out=$(env -u HOME -u GITHUB_WORKSPACE -u RUNNER_WORKSPACE sh lib/cache-restore.sh /tmp/guard-safe-sibling no-such-key /tmp/local-cache "" 2>&1)
          rc=$?
          set -e
          [ "$rc" = "0" ] \
            || (echo "Expected exit 0 for safe sibling path, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'Cache miss' \
            || (echo "Expected 'Cache miss' in output, got: $out" && exit 1)
          echo "Accept safe sibling: OK"

      # Sequential idempotent save: verify that a save against an already-
      # populated entry exits cleanly without touching the existing content.
      # This does NOT exercise parallel mutex contention — real contention is
      # tested by curlewlabs-com/local-mutex in its own repo. What it does
      # exercise is the re-check inside cache-save.sh that makes the waiter
      # path safe: once the entry exists, a second caller (whether arriving
      # after a lock release or just running later in the same job) must
      # detect the existing entry and skip the rsync+mv entirely. The
      # regression this guards is NOT clobbering — it is nesting. POSIX
      # `mv src dest` where dest is an existing directory moves src to
      # dest/basename(src) rather than failing, so a removed re-check would
      # leave the second writer's staging dir nested as
      # entries/<key>/.tmp-<key>-<pid>/ alongside the first writer's top-
      # level files. The content check alone would not catch this (the
      # top-level file still reads "first"), so we also assert that no
      # nested .tmp-* staging subdir survived the second save.
      - name: Set up idempotent-save fixture
        run: |
          mkdir -p /tmp/test-idempotent-first /tmp/test-idempotent-second
          echo "first" > /tmp/test-idempotent-first/h.txt
          echo "second" > /tmp/test-idempotent-second/h.txt

      - name: Save establishes the entry
        uses: ./save
        with:
          path: /tmp/test-idempotent-first
          key: idempotent-key
          cache-dir: /tmp/local-cache

      - name: Second save against existing entry exits cleanly
        uses: ./save
        with:
          path: /tmp/test-idempotent-second
          key: idempotent-key
          cache-dir: /tmp/local-cache

      - name: Verify the first writer's content survived
        run: |
          # The existing-entry guard must let the second save exit before
          # touching the existing entry — so the first writer's content
          # is what stays on disk.
          . lib/cache-common.sh
          encoded_key=$(encode_key 'idempotent-key')
          content=$(cat "/tmp/local-cache/entries/${encoded_key}/h.txt")
          [ "$content" = "first" ] \
            || (echo "Existing-entry guard failed: expected 'first', got '$content'" && exit 1)
          # The content check above would still pass if the guard regressed,
          # because the second writer's content gets nested inside the entry
          # rather than overwriting the top-level file. Assert that no nested
          # staging dir survived: this is what actually catches a removed
          # re-check guard.
          test -z "$(find "/tmp/local-cache/entries/${encoded_key}" -name '.tmp-*')" \
            || { echo "Re-check regressed: found nested staging dir inside entry"; exit 1; }
          echo "Sequential idempotent save: OK"

      # The "v2:" prefix in these marker assertions is the canonical marker
      # version from lib/cache-restore.sh (MARKER_VERSION). If that constant
      # is ever bumped, the literals below must be bumped in lockstep.
      - name: Restore writes v2 marker
        run: |
          mkdir -p /tmp/test-marker-src
          echo "marker-test" > /tmp/test-marker-src/data.txt
          sh lib/cache-save.sh /tmp/test-marker-src marker-key /tmp/local-cache
          sh lib/cache-restore.sh /tmp/test-marker-dst marker-key /tmp/local-cache ""
          marker=$(cat /tmp/test-marker-dst/.local-cache-restore)
          [ "$marker" = "v2:marker-key" ] \
            || (echo "Expected marker 'v2:marker-key', got '$marker'" && exit 1)
          echo "Marker written: OK"

      - name: Second restore with same key is skipped
        run: |
          # Modify the restored content — if restore skips, this survives.
          echo "modified" > /tmp/test-marker-dst/data.txt
          sh lib/cache-restore.sh /tmp/test-marker-dst marker-key /tmp/local-cache ""
          content=$(cat /tmp/test-marker-dst/data.txt)
          [ "$content" = "modified" ] \
            || (echo "Expected 'modified' (skipped restore), got '$content'" && exit 1)
          echo "Same-key skip: OK"

      - name: Restore with different key replaces content
        run: |
          mkdir -p /tmp/test-newkey-src
          echo "new-content" > /tmp/test-newkey-src/data.txt
          sh lib/cache-save.sh /tmp/test-newkey-src new-marker-key /tmp/local-cache
          # Restore new key into the same target that has the old marker.
          sh lib/cache-restore.sh /tmp/test-marker-dst new-marker-key /tmp/local-cache ""
          content=$(cat /tmp/test-marker-dst/data.txt)
          [ "$content" = "new-content" ] \
            || (echo "Expected 'new-content', got '$content'" && exit 1)
          marker=$(cat /tmp/test-marker-dst/.local-cache-restore)
          [ "$marker" = "v2:new-marker-key" ] \
            || (echo "Expected updated marker, got '$marker'" && exit 1)
          echo "Different-key replace: OK"

      - name: v1 target (no marker) is replaced on restore
        run: |
          # Simulate a v1 restore — content exists but no marker file.
          mkdir -p /tmp/test-v1-target
          echo "v1-content" > /tmp/test-v1-target/data.txt
          sh lib/cache-restore.sh /tmp/test-v1-target marker-key /tmp/local-cache ""
          content=$(cat /tmp/test-v1-target/data.txt)
          [ "$content" = "marker-test" ] \
            || (echo "Expected 'marker-test' from cache, got '$content'" && exit 1)
          [ -f /tmp/test-v1-target/.local-cache-restore ] \
            || (echo "Expected v2 marker after migration" && exit 1)
          echo "v1 migration: OK"

      - name: Restore isolation — modifying restored files does not corrupt cache
        run: |
          sh lib/cache-restore.sh /tmp/test-isolation-dst marker-key /tmp/local-cache ""
          echo "corrupted" > /tmp/test-isolation-dst/data.txt
          . lib/cache-common.sh
          encoded_key=$(encode_key 'marker-key')
          cached=$(cat "/tmp/local-cache/entries/${encoded_key}/data.txt")
          [ "$cached" = "marker-test" ] \
            || (echo "Cache entry corrupted: expected 'marker-test', got '$cached'" && exit 1)
          echo "Restore isolation: OK"

      - name: Concurrent restores — each consumer gets an isolated copy
        run: |
          mkdir -p /tmp/test-concurrent-restore-src
          echo "shared" > /tmp/test-concurrent-restore-src/data.txt
          sh lib/cache-save.sh /tmp/test-concurrent-restore-src concurrent-restore-key /tmp/local-cache

          sh lib/cache-restore.sh /tmp/concurrent-dst-a concurrent-restore-key /tmp/local-cache "" &
          sh lib/cache-restore.sh /tmp/concurrent-dst-b concurrent-restore-key /tmp/local-cache "" &
          wait

          [ "$(cat /tmp/concurrent-dst-a/data.txt)" = "shared" ] \
            || (echo "Concurrent restore A has wrong content" && exit 1)
          [ "$(cat /tmp/concurrent-dst-b/data.txt)" = "shared" ] \
            || (echo "Concurrent restore B has wrong content" && exit 1)

          echo "modified-a" > /tmp/concurrent-dst-a/data.txt
          [ "$(cat /tmp/concurrent-dst-b/data.txt)" = "shared" ] \
            || (echo "Modifying A corrupted B" && exit 1)
          . lib/cache-common.sh
          encoded_key=$(encode_key 'concurrent-restore-key')
          [ "$(cat "/tmp/local-cache/entries/${encoded_key}/data.txt")" = "shared" ] \
            || (echo "Modifying A corrupted cache entry" && exit 1)
          echo "Concurrent restore isolation: OK"

      # A second prefix restore against an already-populated target must hit
      # the marker-skip branch in cache-restore.sh (is_current on the
      # is_exact="false" path). Existing tests cover exact-hit-skip and
      # prefix-match-first-time, but not this second-call-is-skipped case —
      # which is the steady-state behavior for the README's restore → install
      # → save pattern when the caller's exact key is slightly newer than the
      # fallback. If this branch regresses, the restore silently starts doing
      # full rsync work on every invocation instead of constant-time work.
      - name: Second prefix restore against populated target is a marker-skip
        run: |
          mkdir -p /tmp/test-prefix-marker-src
          echo "v1-content" > /tmp/test-prefix-marker-src/data.txt
          sh lib/cache-save.sh /tmp/test-prefix-marker-src prefix-marker-v1 /tmp/local-cache

          # First prefix restore populates the target with marker "v2:prefix-marker-v1".
          # The caller's exact key (v2) doesn't exist; restore-keys "prefix-marker-"
          # resolves to the only matching entry (v1).
          sh lib/cache-restore.sh /tmp/test-prefix-marker-dst prefix-marker-v2 /tmp/local-cache "prefix-marker-"
          marker=$(cat /tmp/test-prefix-marker-dst/.local-cache-restore)
          [ "$marker" = "v2:prefix-marker-v1" ] \
            || (echo "Expected marker 'v2:prefix-marker-v1' after first prefix restore, got '$marker'" && exit 1)

          # Modify the restored content — if the second restore skips via
          # marker-match, this modification survives (no rsync overwrite).
          # Same pattern as the "Second restore with same key is skipped" test,
          # but on the prefix-resolution branch.
          echo "modified-between-restores" > /tmp/test-prefix-marker-dst/data.txt
          sh lib/cache-restore.sh /tmp/test-prefix-marker-dst prefix-marker-v2 /tmp/local-cache "prefix-marker-"
          content=$(cat /tmp/test-prefix-marker-dst/data.txt)
          [ "$content" = "modified-between-restores" ] \
            || (echo "Second prefix restore did not hit marker-skip: expected 'modified-between-restores', got '$content'" && exit 1)
          echo "Prefix restore marker-skip: OK"

      # When a caller runs the README's canonical pattern (restore → install
      # → save on the same path) and the restore was a prefix hit, the target
      # ends up with a .local-cache-restore marker pointing at the matched
      # entry. The save step must exclude that marker from the new entry on
      # disk, or else every cache entry that was ever populated via a prefix
      # hit permanently carries a stale marker for the entry it was cloned
      # from. Harmless at runtime but pollutes cache entries with stale
      # metadata.
      - name: Save after prefix restore excludes restore marker
        run: |
          mkdir -p /tmp/test-save-exclude-src
          echo "source" > /tmp/test-save-exclude-src/data.txt
          sh lib/cache-save.sh /tmp/test-save-exclude-src save-exclude-v1 /tmp/local-cache

          # Prefix restore leaves the marker file in the target.
          sh lib/cache-restore.sh /tmp/test-save-exclude-dst save-exclude-v2 /tmp/local-cache "save-exclude-"
          [ -f /tmp/test-save-exclude-dst/.local-cache-restore ] \
            || (echo "Expected marker in target after prefix restore" && exit 1)

          # Save under the caller's exact key. The new entry must not contain
          # the stale marker from the prefix hit.
          sh lib/cache-save.sh /tmp/test-save-exclude-dst save-exclude-v2 /tmp/local-cache
          . lib/cache-common.sh
          encoded_key=$(encode_key 'save-exclude-v2')
          [ -d "/tmp/local-cache/entries/${encoded_key}" ] \
            || (echo "Expected new entry save-exclude-v2" && exit 1)
          [ ! -f "/tmp/local-cache/entries/${encoded_key}/.local-cache-restore" ] \
            || (echo "rsync did not exclude marker — new entry contains stale marker from prefix source" && exit 1)
          [ -f "/tmp/local-cache/entries/${encoded_key}/.local-cache-key" ] \
            || { echo "Expected metadata file in encoded entry"; exit 1; }
          [ -f "/tmp/local-cache/entries/${encoded_key}/data.txt" ] \
            || (echo "Expected data.txt in new entry" && exit 1)
          echo "Save excludes restore marker: OK"

      # Verify the two-phase restore logic introduced for parallel hits
      - name: Set up two-phase logic fixture
        run: |
          mkdir -p /tmp/two-phase-src
          echo "phase-data" > /tmp/two-phase-src/data.txt
          sh lib/cache-save.sh /tmp/two-phase-src phase-v1 /tmp/local-cache-2

      - name: Phase 1 (Quick Check) reports skip-lock for steady-state exact hit
        run: |
          # 1. Populate the target with the exact key
          sh lib/cache-restore.sh /tmp/two-phase-dst phase-v1 /tmp/local-cache-2 ""
          
          # 2. Run Phase 1 check
          out=$(mktemp)
          GITHUB_OUTPUT="$out" sh lib/cache-restore.sh --check /tmp/two-phase-dst phase-v1 /tmp/local-cache-2 ""
          
          # 3. Verify skip-lock is emitted
          grep "skip-lock=true" "$out" || (echo "Expected skip-lock=true for steady-state exact hit" && exit 1)
          echo "Phase 1 skip-lock (exact hit): OK"

      - name: Phase 1 (Quick Check) reports skip-lock for steady-state prefix hit
        run: |
          # 1. Populate target with phase-v1
          sh lib/cache-restore.sh /tmp/two-phase-dst-prefix phase-v1 /tmp/local-cache-2 ""
          
          # 2. Run check with key phase-v2 and restore-keys phase-v1
          out=$(mktemp)
          GITHUB_OUTPUT="$out" sh lib/cache-restore.sh --check /tmp/two-phase-dst-prefix phase-v2 /tmp/local-cache-2 "phase-"
          
          # 3. Verify skip-lock is emitted (target already has the matched content)
          grep "skip-lock=true" "$out" || (echo "Expected skip-lock=true for steady-state prefix hit" && exit 1)
          echo "Phase 1 skip-lock (prefix hit): OK"

      - name: Phase 1 (Quick Check) signals lock for cold prefix hit
        run: |
          # 1. Cache has phase-v1. Target is EMPTY.
          # 2. Run check with key phase-v2 and restore-keys phase-v1
          out=$(mktemp)
          GITHUB_OUTPUT="$out" sh lib/cache-restore.sh --check /tmp/two-phase-dst-cold-prefix phase-v2 /tmp/local-cache-2 "phase-"
          
          # 3. Verify skip-lock is NOT emitted (rsync is required)
          if grep "skip-lock=true" "$out"; then
            echo "Expected no skip-lock for cold prefix hit" && exit 1
          fi
          echo "Phase 1 lock signaling (cold prefix hit): OK"

      - name: Phase 1 (Quick Check) signals lock required for miss
        run: |
          out=$(mktemp)
          GITHUB_OUTPUT="$out" sh lib/cache-restore.sh --check /tmp/two-phase-dst-miss phase-miss /tmp/local-cache-2 ""
          
          # Verify skip-lock is NOT emitted
          if grep "skip-lock=true" "$out"; then
            echo "Expected no skip-lock for miss" && exit 1
          fi
          echo "Phase 1 lock signaling (miss): OK"

      - name: Verify LOCAL_CACHE_HIT in --check steady-state path
        run: |
          # The --check path's is_current early return must also write GITHUB_ENV.
          # First populate a target so the marker exists.
          sh lib/cache-restore.sh /tmp/two-env-dst-check phase-v1 /tmp/local-cache-2 ""

          # Now run --check against the same target — marker matches, so
          # this hits the is_current block and should still write GITHUB_ENV.
          out=$(mktemp)
          env_out=$(mktemp)
          GITHUB_OUTPUT="$out" GITHUB_ENV="$env_out" sh lib/cache-restore.sh --check /tmp/two-env-dst-check phase-v1 /tmp/local-cache-2 ""
          grep "LOCAL_CACHE_HIT=true" "$env_out" || (echo "Expected LOCAL_CACHE_HIT=true in --check steady-state path" && exit 1)
          grep "LOCAL_CACHE_MATCHED_KEY=phase-v1" "$env_out" || (echo "Expected LOCAL_CACHE_MATCHED_KEY in --check steady-state path" && exit 1)
          echo "LOCAL_CACHE_HIT in --check steady-state path: OK"

      - name: Verify LOCAL_CACHE_HIT environment variable correctness
        run: |
          # 1. Exact Hit
          out=$(mktemp)
          env_out=$(mktemp)
          GITHUB_OUTPUT="$out" GITHUB_ENV="$env_out" sh lib/cache-restore.sh /tmp/two-env-dst-exact phase-v1 /tmp/local-cache-2 ""
          grep "LOCAL_CACHE_HIT=true" "$env_out" || (echo "Expected LOCAL_CACHE_HIT=true for exact hit" && exit 1)
          
          # 2. Prefix Hit (must be false to trigger save step)
          out=$(mktemp)
          env_out=$(mktemp)
          GITHUB_OUTPUT="$out" GITHUB_ENV="$env_out" sh lib/cache-restore.sh /tmp/two-env-dst-prefix phase-v2 /tmp/local-cache-2 "phase-"
          grep "LOCAL_CACHE_HIT=false" "$env_out" || (echo "Expected LOCAL_CACHE_HIT=false for prefix hit" && exit 1)
          
          # 3. Miss
          out=$(mktemp)
          env_out=$(mktemp)
          GITHUB_OUTPUT="$out" GITHUB_ENV="$env_out" sh lib/cache-restore.sh /tmp/two-env-dst-miss phase-miss /tmp/local-cache-2 ""
          grep "LOCAL_CACHE_HIT=false" "$env_out" || (echo "Expected LOCAL_CACHE_HIT=false for miss" && exit 1)
          echo "LOCAL_CACHE_HIT environment logic: OK"

      - name: Verify Full Action Output Mapping
        id: action-output-test
        uses: ./
        with:
          path: /tmp/two-action-dst
          key: phase-v1
          cache-dir: /tmp/local-cache-2
      
      - name: Assert Action Outputs
        run: |
          [ "${{ steps.action-output-test.outputs.cache-hit }}" = "true" ] || (echo "Action output cache-hit mismatch" && exit 1)
          [ "${{ steps.action-output-test.outputs.cache-matched-key }}" = "phase-v1" ] || (echo "Action output matched-key mismatch" && exit 1)
          echo "Action output mapping: OK"

      # Touch-on-restore (LRU signal). A served restore must stamp the entry's
      # last-use time — the mtime of its metadata file (.local-cache-key) — so
      # an external least-recently-used sweep can reclaim space by genuine
      # recency of use. This must hold on the constant-time marker-skip path
      # (where a hot-but-old entry would otherwise look stale and risk wrongful
      # eviction), and it must NOT move the entry *directory's* mtime, which
      # prefix/restore-keys resolution sorts on — moving it would silently
      # retarget selection from most-recently-saved to most-recently-used.
      - name: Restore stamps last-use time without disturbing selection order
        run: |
          . lib/cache-common.sh
          stat_mtime() { stat -c %Y "$1" 2>/dev/null || stat -f %m "$1"; }

          mkdir -p /tmp/test-lru-src
          echo "lru" > /tmp/test-lru-src/data.txt
          sh lib/cache-save.sh /tmp/test-lru-src lru-key /tmp/local-cache
          encoded_key=$(encode_key 'lru-key')
          entry="/tmp/local-cache/entries/${encoded_key}"

          # Populate the target + marker so the next restore takes the
          # constant-time skip path.
          sh lib/cache-restore.sh /tmp/test-lru-dst lru-key /tmp/local-cache ""

          # Age both the metadata file and the directory to a known past time.
          touch -t 202001010000 "${entry}/.local-cache-key" "${entry}"
          meta_before=$(stat_mtime "${entry}/.local-cache-key")
          dir_before=$(stat_mtime "${entry}")

          # Marker-skip restore (constant-time path).
          sh lib/cache-restore.sh /tmp/test-lru-dst lru-key /tmp/local-cache ""
          [ "$(stat_mtime "${entry}/.local-cache-key")" -gt "$meta_before" ] \
            || (echo "skip-path restore did not stamp last-use time" && exit 1)
          [ "$(stat_mtime "${entry}")" = "$dir_before" ] \
            || (echo "skip-path restore moved entry dir mtime — corrupts prefix selection order" && exit 1)

          # Full-rsync path (fresh target) also stamps last-use time.
          touch -t 202001010000 "${entry}/.local-cache-key"
          meta_before=$(stat_mtime "${entry}/.local-cache-key")
          sh lib/cache-restore.sh /tmp/test-lru-dst-fresh lru-key /tmp/local-cache ""
          [ "$(stat_mtime "${entry}/.local-cache-key")" -gt "$meta_before" ] \
            || (echo "full-path restore did not stamp last-use time" && exit 1)

          echo "Touch-on-restore last-use stamping: OK"

      # set -eu hardening. With nounset on, a bare positional ($1) on a missing
      # arg would abort with "unbound variable" before the script's own
      # empty-arg check runs. The entry scripts guard the positionals (${1:-})
      # so the caller-facing "must not be empty" error stays the single failure
      # path. Assert that contract for both scripts — exit 1 with the friendly
      # message, never a leaked nounset abort.
      - name: Entry scripts report missing args cleanly under set -eu
        run: |
          for script in cache-restore cache-save; do
            set +e
            out=$(sh "lib/${script}.sh" 2>&1)
            rc=$?
            set -e
            [ "$rc" = "1" ] \
              || (echo "${script}: expected exit 1 for missing args, got $rc. Output: $out" && exit 1)
            echo "$out" | grep -q 'must not be empty' \
              || (echo "${script}: expected 'must not be empty' error, got: $out" && exit 1)
            if echo "$out" | grep -qi 'unbound variable'; then
              echo "${script}: set -u leaked an 'unbound variable' abort instead of the friendly error" && exit 1
            fi
            echo "${script}: missing-arg guard OK"
          done

      # cache-gc eviction. A served restore records its target in a parallel
      # targets/<k>/ tree (a sibling of entries/, kept out of the entry so it
      # cannot move the entry's mtime); the gc reclaims cold entries AND those
      # recorded per-runner copies. These assert: the record lands in the
      # parallel tree and the entry's mtime is untouched; a cold entry and its
      # target are evicted while a hot one survives; a dry run touches nothing;
      # a target modified within the window (an in-progress build) spares its
      # entry; and a corrupted/forged record can never widen the sweep to a
      # guarded path.
      - name: Restore records its target in the parallel tree without touching the entry
        run: |
          . lib/cache-common.sh
          stat_mtime() { stat -c %Y "$1" 2>/dev/null || stat -f %m "$1"; }
          GC=/tmp/gc-cache-record
          mkdir -p /tmp/gc-r-src
          echo data > /tmp/gc-r-src/data.txt
          sh lib/cache-save.sh /tmp/gc-r-src rec-key "$GC"
          entry="$GC/entries/$(encode_key rec-key)"
          # Age the entry dir so we can prove a restore does not bump its mtime —
          # prefix/restore-keys resolution sorts entries on it.
          touch -t 202001010000 "$entry"
          dir_before=$(stat_mtime "$entry")

          sh lib/cache-restore.sh /tmp/gc-r-tgt rec-key "$GC" ""

          # The record lands in the parallel targets/ tree, not the entry.
          rec="$GC/targets/$(encode_key rec-key)/$(sha256_hex /tmp/gc-r-tgt)"
          [ -f "$rec" ] || (echo "expected a target record in the parallel tree" && exit 1)
          [ "$(cat "$rec")" = /tmp/gc-r-tgt ] \
            || (echo "record content wrong: $(cat "$rec")" && exit 1)
          # The entry gains no records child and keeps its mtime; nothing leaks
          # into the restored target either.
          [ ! -e "$entry/targets" ] || (echo "records leaked into the entry" && exit 1)
          [ "$(stat_mtime "$entry")" = "$dir_before" ] \
            || (echo "restore moved the entry dir mtime — corrupts prefix selection" && exit 1)
          [ ! -e /tmp/gc-r-tgt/targets ] \
            || (echo "records leaked into the restored target" && exit 1)
          echo "Target recording (parallel tree, entry untouched): OK"

      - name: GC evicts cold entries and their targets, keeps hot ones
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-evict
          mkdir -p /tmp/gc-e-cold-src /tmp/gc-e-hot-src
          echo cold > /tmp/gc-e-cold-src/data.txt
          echo hot > /tmp/gc-e-hot-src/data.txt
          sh lib/cache-save.sh /tmp/gc-e-cold-src ecold-key "$GC"
          sh lib/cache-save.sh /tmp/gc-e-hot-src ehot-key "$GC"
          sh lib/cache-restore.sh /tmp/gc-e-cold-tgt ecold-key "$GC" ""
          sh lib/cache-restore.sh /tmp/gc-e-hot-tgt ehot-key "$GC" ""
          cold_entry="$GC/entries/$(encode_key ecold-key)"
          hot_entry="$GC/entries/$(encode_key ehot-key)"

          # Age the cold entry's last-use and its whole restored target.
          touch -t 202001010000 "$cold_entry/.local-cache-key"
          find /tmp/gc-e-cold-tgt -exec touch -t 202001010000 {} +

          # Dry run touches nothing.
          sh lib/cache-gc.sh --max-age-days 1 "$GC"
          { [ -d "$cold_entry" ] && [ -d /tmp/gc-e-cold-tgt ]; } \
            || (echo "dry run must not delete anything" && exit 1)
          echo "GC dry run keeps everything: OK"

          # Apply: cold entry + its target gone; hot entry + its target kept.
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ ! -d "$cold_entry" ] || (echo "cold entry not evicted" && exit 1)
          [ ! -e /tmp/gc-e-cold-tgt ] || (echo "cold target not reclaimed" && exit 1)
          [ -d "$hot_entry" ] || (echo "hot entry wrongly evicted" && exit 1)
          [ -d /tmp/gc-e-hot-tgt ] || (echo "hot target wrongly reclaimed" && exit 1)
          echo "GC evicts cold entry + target, keeps hot: OK"

      - name: GC spares a cold entry whose target was modified within the window
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-live
          mkdir -p /tmp/gc-l-src
          echo live > /tmp/gc-l-src/data.txt
          sh lib/cache-save.sh /tmp/gc-l-src elive-key "$GC"
          sh lib/cache-restore.sh /tmp/gc-l-tgt elive-key "$GC" ""
          live_entry="$GC/entries/$(encode_key elive-key)"
          # Entry looks cold, but the target has a freshly-written file.
          touch -t 202001010000 "$live_entry/.local-cache-key"
          echo building > /tmp/gc-l-tgt/inprogress.txt
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ -d "$live_entry" ] || (echo "entry with a live target must be kept" && exit 1)
          [ -d /tmp/gc-l-tgt ] || (echo "a live target must not be reclaimed" && exit 1)
          # The record must survive too, or the live copy is orphaned — a later
          # sweep could never reclaim it once it goes idle.
          [ -f "$GC/targets/$(encode_key elive-key)/$(sha256_hex /tmp/gc-l-tgt)" ] \
            || (echo "live target's record was dropped — copy would be orphaned" && exit 1)
          echo "GC spares cold entry with a live target (record kept): OK"

      - name: GC spares a dangerous target path but still reclaims its cold entry
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-danger
          mkdir -p /tmp/gc-d-src /tmp/gc-d-home
          echo x > /tmp/gc-d-src/data.txt
          sh lib/cache-save.sh /tmp/gc-d-src edanger-key "$GC"
          dentry="$GC/entries/$(encode_key edanger-key)"
          # Forge a record pointing at the HOME we pass in, and age the entry.
          mkdir -p "$GC/targets/$(encode_key edanger-key)"
          printf '%s' /tmp/gc-d-home > "$GC/targets/$(encode_key edanger-key)/forged"
          touch -t 202001010000 "$dentry/.local-cache-key"
          # The reclaim step guards the forged path (never rm a HOME/root/
          # workspace), so HOME survives — but the cold entry and its forged
          # record are still reclaimed, so one bad record can't pin an entry in
          # the store forever.
          HOME=/tmp/gc-d-home sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ -d /tmp/gc-d-home ] || (echo "gc deleted a guarded HOME path" && exit 1)
          [ ! -d "$dentry" ] || (echo "cold entry should still be reclaimed" && exit 1)
          echo "GC dangerous-target guard (path spared, entry reclaimed): OK"

      # Ownership is decided by the target's marker, not by which entry recorded
      # it: a target re-restored to a new key belongs to that key, even though
      # the first key still holds a stale record naming it. Evicting the first
      # (cold) key must not reclaim a target the second (hot) key now owns.
      - name: GC spares a target owned by a different key than the evicted one
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-own
          mkdir -p /tmp/gc-o-k1-src /tmp/gc-o-k2-src
          echo one > /tmp/gc-o-k1-src/data.txt
          echo two > /tmp/gc-o-k2-src/data.txt
          sh lib/cache-save.sh /tmp/gc-o-k1-src own-k1 "$GC"
          sh lib/cache-save.sh /tmp/gc-o-k2-src own-k2 "$GC"
          # Restore k1 then k2 into the SAME target: it ends up owned by k2
          # (marker v2:own-k2), while k1 still holds a stale record naming it.
          sh lib/cache-restore.sh /tmp/gc-o-tgt own-k1 "$GC" ""
          sh lib/cache-restore.sh /tmp/gc-o-tgt own-k2 "$GC" ""
          [ "$(cat /tmp/gc-o-tgt/.local-cache-restore)" = "v2:own-k2" ] \
            || (echo "target should be owned by k2 after the second restore" && exit 1)
          k1_entry="$GC/entries/$(encode_key own-k1)"
          k2_entry="$GC/entries/$(encode_key own-k2)"
          touch -t 202001010000 "$k1_entry/.local-cache-key"   # k1 cold, k2 hot
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ ! -d "$k1_entry" ] || (echo "cold k1 entry should be evicted" && exit 1)
          [ -d "$k2_entry" ] || (echo "hot k2 entry wrongly evicted" && exit 1)
          [ -e /tmp/gc-o-tgt ] \
            || (echo "target wrongly reclaimed — it belongs to hot k2, not cold k1" && exit 1)
          echo "GC target ownership (marker, not record): OK"

      # The reclaim step re-checks the owning entry's coldness UNDER the target
      # lock — the guard that catches a concurrent skip-hit restore, which bumps
      # the owner's last-use while holding that lock and leaves the target's
      # files untouched (so the mtime backstop can't see it). Exercised on the
      # internal reclaim subcommand with a hot vs cold owner, target files aged
      # so the owner-coldness gate is the only thing that can decide.
      - name: GC reclaim honors the owner-coldness gate under the target lock
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-ownercold
          mkdir -p /tmp/gc-oc-src
          echo d > /tmp/gc-oc-src/data.txt
          sh lib/cache-save.sh /tmp/gc-oc-src oc-key "$GC"
          sh lib/cache-restore.sh /tmp/gc-oc-tgt oc-key "$GC" ""
          meta="$GC/entries/$(encode_key oc-key)/.local-cache-key"
          now=$(date +%s); cutoff=$((now - 86400)); tally=$(mktemp)
          find /tmp/gc-oc-tgt -exec touch -t 202001010000 {} +
          touch "$meta"   # hot owner -> keep the target and signal live (exit 3)
          set +e
          GC_TARGET_PATH=/tmp/gc-oc-tgt GC_OWNER_KEY=oc-key GC_OWNER_META="$meta" \
            GC_MAX_AGE_DAYS=1 GC_APPLY=true GC_VERB=removed GC_TARGETS_TALLY="$tally" \
            GC_NOW="$now" GC_CUTOFF="$cutoff" \
            sh lib/cache-gc.sh --__reclaim-target
          rc=$?
          set -e
          [ "$rc" = 3 ] \
            || (echo "hot owner should signal live (exit 3), got $rc" && exit 1)
          [ -e /tmp/gc-oc-tgt ] \
            || (echo "reclaim deleted a target whose owner is hot — a live job would break" && exit 1)
          touch -t 202001010000 "$meta"   # cold owner -> reclaim (exit 0)
          set +e
          GC_TARGET_PATH=/tmp/gc-oc-tgt GC_OWNER_KEY=oc-key GC_OWNER_META="$meta" \
            GC_MAX_AGE_DAYS=1 GC_APPLY=true GC_VERB=removed GC_TARGETS_TALLY="$tally" \
            GC_NOW="$now" GC_CUTOFF="$cutoff" \
            sh lib/cache-gc.sh --__reclaim-target
          rc=$?
          set -e
          [ "$rc" = 0 ] \
            || (echo "cold owner should reclaim (exit 0), got $rc" && exit 1)
          [ ! -e /tmp/gc-oc-tgt ] \
            || (echo "reclaim did not delete a target whose owner is cold" && exit 1)
          rm -f "$tally"
          echo "GC reclaim owner-coldness gate: OK"

      # gc takes the same locks save/restore do; without the lock CLI there is no
      # safe way to proceed, so it must refuse rather than sweep unlocked.
      - name: GC refuses to run without a lock CLI
        run: |
          GC=/tmp/gc-cache-nocli
          mkdir -p "$GC/entries"
          set +e
          out=$(env -u LOCAL_MUTEX_CLI sh lib/cache-gc.sh --apply "$GC" 2>&1); rc=$?
          set -e
          [ "$rc" -eq 1 ] \
            || (echo "expected exit 1 without LOCAL_MUTEX_CLI, got $rc. Output: $out" && exit 1)
          echo "$out" | grep -q 'LOCAL_MUTEX_CLI' \
            || (echo "expected a LOCAL_MUTEX_CLI error, got: $out" && exit 1)
          echo "GC no-lock-CLI refusal: OK"

      # max-age-days=0 makes cutoff=now (hot reads cold) and find -mtime -0 match
      # nothing — both guards fail open. Leading zeros are octal traps. All must
      # be rejected, not silently mis-windowed.
      - name: GC rejects unsafe max-age-days values
        run: |
          GC=/tmp/gc-cache-badage
          mkdir -p "$GC/entries"
          for bad in 0 08 010 -1 abc; do
            set +e
            out=$(sh lib/cache-gc.sh --apply --max-age-days "$bad" "$GC" 2>&1); rc=$?
            set -e
            [ "$rc" != 0 ] \
              || (echo "max-age-days '$bad' must be rejected (got rc 0): $out" && exit 1)
          done
          echo "GC max-age-days validation: OK"

      # A per-target lock and record must identify one physical target by one
      # canonical string, or two spellings (trailing slash, //) split the lock
      # and let gc race a live restore. All spellings must collapse to one record
      # and gc must reclaim the single normalized target.
      - name: GC target identity is normalized across path spellings
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-norm
          mkdir -p /tmp/gc-n-src /tmp/gc-n-dir
          echo n > /tmp/gc-n-src/data.txt
          sh lib/cache-save.sh /tmp/gc-n-src norm-key "$GC"
          sh lib/cache-restore.sh /tmp/gc-n-dir/t norm-key "$GC" ""
          sh lib/cache-restore.sh /tmp/gc-n-dir/t/ norm-key "$GC" ""
          sh lib/cache-restore.sh /tmp/gc-n-dir//t norm-key "$GC" ""
          recdir="$GC/targets/$(encode_key norm-key)"
          n=$(find "$recdir" -type f | wc -l | tr -d ' ')
          [ "$n" = 1 ] \
            || (echo "3 spellings of one target should collapse to 1 record, got $n" && exit 1)
          [ "$(cat "$recdir"/*)" = /tmp/gc-n-dir/t ] \
            || (echo "record not normalized: $(cat "$recdir"/*)" && exit 1)
          entry="$GC/entries/$(encode_key norm-key)"
          touch -t 202001010000 "$entry/.local-cache-key"
          find /tmp/gc-n-dir/t -exec touch -t 202001010000 {} +
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ ! -e /tmp/gc-n-dir/t ] || (echo "normalized target not reclaimed" && exit 1)
          echo "GC path normalization (one lock/record per physical target): OK"

      # The orphan-record sweep removes records whose entry is gone (e.g. a manual
      # entries/ reset) but must NEVER delete the live on-disk dir a record names —
      # with the entry gone there is no coldness signal to justify it.
      - name: GC removes orphaned records but never the live dirs they name
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-orphan
          mkdir -p "$GC/entries" "$GC/targets/$(encode_key gone-key)" /tmp/gc-orphan-live
          echo x > /tmp/gc-orphan-live/keep.txt
          printf '%s' /tmp/gc-orphan-live > "$GC/targets/$(encode_key gone-key)/rec"
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ ! -d "$GC/targets/$(encode_key gone-key)" ] \
            || (echo "stale orphan record dir not removed" && exit 1)
          [ -d /tmp/gc-orphan-live ] \
            || (echo "gc deleted a live dir named by an orphan record" && exit 1)
          echo "GC orphan-record cleanup (record gone, live dir spared): OK"

      # Entries written before the metadata file have no last-use signal and no
      # raw key; gc must leave them alone.
      - name: GC skips legacy entries with no metadata
        run: |
          GC=/tmp/gc-cache-legacy
          mkdir -p "$GC/entries/k-legacy"
          echo old > "$GC/entries/k-legacy/data.txt"
          touch -t 202001010000 "$GC/entries/k-legacy" "$GC/entries/k-legacy/data.txt"
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ -d "$GC/entries/k-legacy" ] \
            || (echo "gc evicted a legacy entry with no metadata" && exit 1)
          echo "GC legacy-entry skip: OK"

      # A store with no entries dir is a clean no-op (not an error) — with the
      # lock CLI present, so this reaches that branch rather than the CLI guard.
      - name: GC on a store with no entries dir exits cleanly
        run: |
          GC=/tmp/gc-cache-noent
          rm -rf "$GC"
          mkdir -p "$GC"
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          echo "GC no-entries-dir clean exit: OK"

      # A valid target path containing spaces exercises the env-passing lock/record
      # design end-to-end (the lock name and record must survive word-splitting).
      - name: GC handles a target path containing spaces end-to-end
        run: |
          . lib/cache-common.sh
          GC=/tmp/gc-cache-space
          mkdir -p /tmp/gc-sp-src "/tmp/gc sp dir"
          echo s > /tmp/gc-sp-src/data.txt
          sh lib/cache-save.sh /tmp/gc-sp-src sp-key "$GC"
          sh lib/cache-restore.sh "/tmp/gc sp dir/t" sp-key "$GC" ""
          [ -f "/tmp/gc sp dir/t/data.txt" ] || (echo "restore to a spaced path failed" && exit 1)
          entry="$GC/entries/$(encode_key sp-key)"
          touch -t 202001010000 "$entry/.local-cache-key"
          find "/tmp/gc sp dir/t" -exec touch -t 202001010000 {} +
          sh lib/cache-gc.sh --apply --max-age-days 1 "$GC"
          [ ! -e "/tmp/gc sp dir/t" ] || (echo "gc did not reclaim a spaced target path" && exit 1)
          echo "GC spaced target path: OK"

      # End-to-end through the real gc action + downloaded local-mutex, proving
      # the store-wide lock hands cache-gc.sh a working LOCAL_MUTEX_CLI and the
      # nested per-key/per-target locks reclaim as the direct-script tests expect.
      - name: Populate the gc-action fixture source
        run: |
          mkdir -p /tmp/gc-act-src
          echo act > /tmp/gc-act-src/data.txt
      - name: Save a fixture to reclaim via the gc action
        uses: ./save
        with:
          path: /tmp/gc-act-src
          key: gc-act-key
          cache-dir: /tmp/gc-act-cache
      - name: Restore it so a target is recorded
        uses: ./
        with:
          path: /tmp/gc-act-tgt
          key: gc-act-key
          cache-dir: /tmp/gc-act-cache
      - name: Age the gc-action entry and target
        run: |
          . lib/cache-common.sh
          entry="/tmp/gc-act-cache/entries/$(encode_key gc-act-key)"
          touch -t 202001010000 "$entry/.local-cache-key"
          find /tmp/gc-act-tgt -exec touch -t 202001010000 {} +
      - name: Garbage-collect via the gc action
        uses: ./gc
        with:
          cache-dir: /tmp/gc-act-cache
          max-age-days: 1
          apply: true
      - name: Verify the gc action reclaimed the cold entry and target
        run: |
          . lib/cache-common.sh
          entry="/tmp/gc-act-cache/entries/$(encode_key gc-act-key)"
          [ ! -d "$entry" ] || (echo "gc action did not evict the cold entry" && exit 1)
          [ ! -e /tmp/gc-act-tgt ] || (echo "gc action did not reclaim the cold target" && exit 1)
          echo "GC action end-to-end (real local-mutex wiring): OK"
